<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- pipeline -->
  <g fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5">
    <rect x="20" y="20" width="150" height="62" rx="8"/>
    <rect x="196" y="20" width="170" height="62" rx="8"/>
    <rect x="392" y="20" width="210" height="62" rx="8"/>
    <rect x="628" y="20" width="170" height="62" rx="8"/>
  </g>
  <g fill="#1f2328" font-size="14" text-anchor="middle">
    <text x="95" y="49">JavaScript</text><text x="95" y="67">source</text>
    <text x="281" y="49">Parser</text><text x="281" y="67">(AST)</text>
    <text x="497" y="45">Bytecode generator</text><text x="497" y="63">(Ignition)</text>
    <text x="713" y="49">Bytecode</text><text x="713" y="67">&#160;</text>
  </g>

  <!-- top arrows -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M170 51 H192"/>
    <path d="M366 51 H388"/>
    <path d="M602 51 H624"/>
  </g>
  <text x="688" y="98" fill="#6b7280" font-size="12" text-anchor="middle">bytecode</text>

  <!-- bytecode down to interpreter -->
  <path d="M713 82 V132 H124 V166" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- interpreter / profiler / turbofan -->
  <rect x="24" y="170" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="300" y="170" width="180" height="72" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="548" y="170" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <g fill="#1f2328" font-size="14" text-anchor="middle">
    <text x="124" y="203">Interpreter</text><text x="124" y="221" fill="#6b7280" font-size="12">(Ignition)</text>
    <text x="390" y="203">Profiler /</text><text x="390" y="221" fill="#6b7280" font-size="12">feedback</text>
    <text x="648" y="203">Optimizing JIT</text><text x="648" y="221" fill="#6b7280" font-size="12">(TurboFan)</text>
  </g>

  <g stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M224 206 H296"/>
    <path d="M480 206 H544"/>
    <path d="M648 242 V296"/>
  </g>
  <text x="260" y="198" fill="#6b7280" font-size="12" text-anchor="middle">profile</text>
  <text x="512" y="198" fill="#6b7280" font-size="12" text-anchor="middle">hot</text>

  <!-- optimized code -->
  <rect x="548" y="300" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="648" y="333" fill="#1f2328" font-size="14" text-anchor="middle">Optimized</text>
  <text x="648" y="351" fill="#1f2328" font-size="14" text-anchor="middle">machine code</text>

  <!-- deopt -->
  <path d="M548 336 H124 V246" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowA)"/>
  <text x="300" y="330" fill="#2563eb" font-size="12" text-anchor="middle">deoptimise</text>

  <!-- runtime band -->
  <rect x="24" y="410" width="774" height="86" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="434" fill="#6b7280" font-size="12" font-weight="600" letter-spacing=".6">RUNTIME</text>
  <g fill="#fff" stroke="#d1d5db" stroke-width="1.2">
    <rect x="40" y="444" width="176" height="38" rx="6"/>
    <rect x="230" y="444" width="176" height="38" rx="6"/>
    <rect x="420" y="444" width="176" height="38" rx="6"/>
    <rect x="610" y="444" width="172" height="38" rx="6"/>
  </g>
  <g fill="#1f2328" font-size="13" text-anchor="middle">
    <text x="128" y="468">Heap &amp; garbage collector</text>
    <text x="318" y="468">Object model</text>
    <text x="508" y="468">Call stack</text>
    <text x="696" y="468">Built-ins / host APIs</text>
  </g>
  <line x1="124" y1="242" x2="124" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="390" y1="410" x2="390" y2="242" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text x="24" y="514" fill="#6b7280" font-size="12">Simplified architecture of the Google V8 JavaScript engine (interpreter: Ignition; optimizing JIT: TurboFan).</text>
</svg>
